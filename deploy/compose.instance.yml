# deploy/compose.instance.yml -- mt5-gateway instance TEMPLATE (WO-MT5GW-0002 Task 5,
# parametrised by MT5GW-TEMPLATE-001).
#
# NO instance values live in this file. Every instance-specific value is a ${VAR}
# supplied by the generated, NON-SECRET instance.env produced by:
#     tools/mt5ctl render <instance-dir>/instance.yaml
# Secrets are never in this file or in instance.env: they are compose file-secrets
# whose source files live in SECRETS_DIR (outside the repo, dir 0700, files 0600).
#
# Validate only (never `up` without the owner's explicit go):
#     tools/mt5ctl render <instance-dir>/instance.yaml     # lints, renders, `docker compose config`
#
# Differences from the pre-template file (behaviour preserved for the default case):
#   * image:        was hard-coded mt5-gateway:0.2.0-rc6 -> ${IMAGE_REF} (per instance).
#   * ports:        was always "${VNC_BIND}:6901" -> NO ports here. The operator UI is
#                   published only via deploy/compose.operator-ui.yml, which mt5ctl adds
#                   when ports.operator_ui is set (loopback bind enforced by lint).
#   * network:      was project-scoped `instance-net` -> explicit name ${NETWORK_NAME}.
#   * volume:       was ${INSTANCE_NAME}-data -> ${DATA_VOLUME} (lint: must start with
#                   "<instance_name>-"; the default rule yields the same name).
#   * restart:      was "no" -> ${RESTART_POLICY}, default "no" (unchanged).
#   * limits:       mem_limit was fixed 2048m -> ${MEM_LIMIT_MB}; cpus/pids_limit added.
#   * servers.dat:  was a fixed host path -> ${SERVERS_DAT} (outside the repo).
#   * secrets dir:  was ${INSTANCE_DIR}/secrets -> ${SECRETS_DIR}.
#   * TZ:           added (${TZ}).

name: ${INSTANCE_NAME:?}

services:
  mt5-gateway:
    image: ${IMAGE_REF:?}
    container_name: ${INSTANCE_NAME:?}
    restart: ${RESTART_POLICY:-no}
    env_file:
      - ${INSTANCE_ENV_FILE:?}
    # No `ports:` on purpose. The RPyC/bridge port (18812) is never published; it is
    # reachable only from containers on this instance's own network.
    secrets:
      # Compose (non-Swarm) mounts these root:root 0400 regardless of uid/gid/mode
      # overrides. start.sh reads them via sudo (KNOWN DEFERRED hazard, see
      # docs/TEMPLATE-CONFIG.md and tests/test_static_security.py).
      - mt5_login
      - mt5_password
      - vnc_password
    volumes:
      # Shared broker-directory seed, read-only, host-only, never committed.
      - ${SERVERS_DAT:?}:/seed/servers.dat:ro
      # Persistent Wine prefix + terminal state.
      - data:/home/headless
    tmpfs:
      # start.sh renders the MT5 login config / VNC password file here (tmpfs only).
      - /run/gateway-secrets:mode=0700
    networks:
      - instance-net
    mem_limit: ${MEM_LIMIT_MB:?}m
    cpus: ${CPUS:?}
    pids_limit: ${PIDS_LIMIT:?}
    labels:
      mt5gateway.instance: "${INSTANCE_NAME}"
      mt5gateway.broker: "${BROKER}"
      mt5gateway.environment: "${ENVIRONMENT}"

secrets:
  mt5_login:
    file: ${SECRETS_DIR:?}/mt5_login
  mt5_password:
    file: ${SECRETS_DIR:?}/mt5_password
  vnc_password:
    file: ${SECRETS_DIR:?}/vnc_password

volumes:
  data:
    name: ${DATA_VOLUME:?}

networks:
  # Named, per-instance bridge network created by compose itself. Not `internal`
  # (the terminal needs outbound internet for broker + first-boot downloads).
  instance-net:
    name: ${NETWORK_NAME:?}
