# deploy/compose.instance.yml — mt5-gateway paper-instance TEMPLATE (WO-MT5GW-0002 Task 5)
#
# No instance values live in this file. Everything instance-specific comes from
# that instance's own instance.env, passed via --env-file so it is available BOTH
# for compose's own ${...} substitution (this file) AND injected into the running
# container via env_file below.
#
# Usage (per instance, e.g. mt5-vantage-paper):
#   INSTANCE_DIR=/srv/mt5-gateway-instances/mt5-vantage-paper
#   docker compose \
#     --env-file "$INSTANCE_DIR/instance.env" \
#     -f deploy/compose.instance.yml \
#     -p "${INSTANCE_NAME:-mt5-instance}" \
#     config   # validate only — do not run `up` without Matt's explicit go
#
# INSTANCE_DIR must also be exported (or passed via -e) for the secrets file
# paths below to resolve; it is not itself a key in instance.env because it is
# a filesystem location, not an application value.

services:
  mt5-gateway:
    image: mt5-gateway:0.2.0-rc6
    container_name: ${INSTANCE_NAME}
    restart: "no"
    env_file:
      - ${INSTANCE_DIR}/instance.env
    ports:
      # KasmVNC web/websocket port (6901) -- confirmed via WO-MT5GW-0003
      # Task 1's real run that the raw RFB port (5901, the original choice
      # here) never actually binds a listener in this image at all (checked
      # /proc/net/tcp inside a running container: only 6901 and the bridge
      # port 18812 are listening). The RPyC/bridge port (18812 inside the
      # container) is intentionally NOT published here -- it stays reachable
      # only from other containers on this compose project's own network
      # below.
      - "${VNC_BIND}:6901"
    secrets:
      # Docker Compose (non-Swarm) does NOT support the uid/gid/mode
      # overrides above -- confirmed via a live "not supported, they will be
      # ignored" warning during the real WO-MT5GW-0003 Task 1 run. Secrets
      # are mounted root:root mode 0400 regardless; the container's process
      # runs as the non-root "headless" user (uid 1000) and cannot read them
      # directly. Fixed in start.sh instead: headless has passwordless sudo
      # (see the Dockerfile), so render_vnc_password() and
      # render_mt5_ini_from_secrets() read the secret files via `sudo`.
      - mt5_login
      - mt5_password
      - vnc_password
      - bridge_token
    volumes:
      # WO-MT5GW-0006: shared broker-directory seed, read-only, host-only --
      # NEVER committed to git. Not instance-specific (same seed for every
      # instance), so this path is a fixed host path rather than an
      # ${INSTANCE_DIR}-relative one like the secrets above. start.sh copies
      # this into the terminal's own Config/ on first boot ONLY (see
      # seed_servers_dat_if_missing() in start.sh) -- later boots never
      # touch it again, so anything a user finds/adds via "Find your
      # company" persists across restarts instead of being overwritten.
      - /srv/mt5-gateway-instances/_shared/servers.dat:/seed/servers.dat:ro
      # Persistent named volume for the Wine prefix + terminal state (MT5
      # install, Config/, logs) -- WITHOUT this, every container recreation
      # is a full fresh MT5 install from scratch (~90-100s) and nothing
      # survives a restart. Named mt5-<broker>-<env>-data per the instance
      # naming convention; ${INSTANCE_NAME} already IS mt5-<broker>-<env>.
      - data:/home/headless
    tmpfs:
      # WO-MT5GW-0003: start.sh renders the MT5 login config and the KasmVNC
      # VncAuth password file here from the Docker secrets above -- tmpfs
      # only, never the persistent named volume. mode=0700 restricts it to
      # the containers own user.
      - /run/gateway-secrets:mode=0700
    networks:
      - instance-net
    mem_limit: 2048m
    labels:
      mt5gateway.instance: "${INSTANCE_NAME}"
      mt5gateway.broker: "${BROKER}"
      mt5gateway.environment: "${ENVIRONMENT}"

secrets:
  mt5_login:
    file: ${INSTANCE_DIR}/secrets/mt5_login
  mt5_password:
    file: ${INSTANCE_DIR}/secrets/mt5_password
  vnc_password:
    file: ${INSTANCE_DIR}/secrets/vnc_password
  bridge_token:
    file: ${INSTANCE_DIR}/secrets/bridge_token

volumes:
  # Persistent per-instance Wine prefix + terminal state. Compose creates
  # this itself on first `up` (prefixed with the project/instance name,
  # same convention as the network below) -- never `docker volume create`d
  # by hand.
  data:
    name: ${INSTANCE_NAME}-data

networks:
  # Compose-project-scoped network, created by `docker compose up` itself when
  # this project first runs — never `docker network create`d by hand, and
  # isolated from every other project's containers by default. NOT Compose's
  # `internal: true` flag: that would also block outbound internet, which
  # this container needs (broker connection, MT5 first-boot installer/update
  # downloads). Isolation here means "its own project network," not "no
  # internet access."
  instance-net: {}
